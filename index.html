<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>英超數據板 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#6b7280;--line:#e5e7eb;--soft:#f0f2f5;--acc:#5b2be0;--win:#16a34a;--draw:#9ca3af;--loss:#dc2626;--warn:#d97706;--h:#2563eb;--a:#e11d48;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f13;--card:#171a20;--ink:#e8eaed;--mute:#9aa1ad;--line:#262a33;--soft:#1e222a;--acc:#9b7bff;--h:#60a5fa;--a:#fb7185;--shadow:none}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC",system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.num,.sc{font-family:"Saira Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 6px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:700 20px "Saira Condensed","Noto Sans TC";letter-spacing:.3px}
header .sub{color:var(--mute);font-size:12px}
main{max-width:760px;margin:0 auto;padding:10px 12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:9;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:8px 0 7px;color:var(--mute);text-decoration:none;font-size:12px}
nav.tabs a b{display:block;font-size:18px;line-height:1.2}
nav.tabs a.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);margin:10px 0;overflow:hidden}
.pad{padding:12px 14px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.mute{color:var(--mute)}.small{font-size:12px}.xs{font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
a.chip{text-decoration:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:#fff;font:700 10px "Saira Condensed";flex:none}
.day{margin:16px 2px 4px;font-weight:700;font-size:13px;color:var(--mute)}
.match .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0}
.match .t{color:inherit;text-decoration:none;display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;min-width:0}
.match .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .t.r{justify-content:flex-end;text-align:right}
.score{font:700 26px "Saira Condensed";min-width:64px;text-align:center}
.score small{display:block;font:500 11px "Noto Sans TC";color:var(--mute)}
.pbar{display:flex;height:22px;border-radius:7px;overflow:hidden;font:600 12px "Saira Condensed";color:#fff}
.pbar div{display:flex;align-items:center;justify-content:center;min-width:0}
.pbar .ph{background:var(--h)}.pbar .pd{background:var(--draw)}.pbar .pa{background:var(--a)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kv span{background:var(--soft);border-radius:8px;padding:3px 8px;font-size:12px}
.kv b{font-family:"Saira Condensed";font-size:14px;margin-left:3px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}
.tag.ai{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.tag.live{background:#dc2626;color:#fff}.tag.ft{background:var(--soft);color:var(--mute)}
.tag.ok{background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win)}
.tag.bad{background:color-mix(in srgb,var(--loss) 14%,transparent);color:var(--loss)}
.headline{margin-top:8px;font-size:14px}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.more{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--mute);font-weight:500}
.cmp td{font-family:"Saira Condensed";font-size:15px}
ul.reasons{margin:6px 0;padding-left:18px}ul.reasons li{margin:3px 0}
.hist{border-left:2px solid var(--line);margin:6px 0 0 4px;padding-left:10px}
.hist div{margin:4px 0;font-size:12px}
.inj{font-size:12px;margin:3px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--mute);font-size:11px;padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line);font-family:"Saira Condensed";font-size:15px}
.tbl td.tn{text-align:left;font-family:"Noto Sans TC";font-size:13px;font-weight:500}
.tbl tr.zone-cl td:first-child{box-shadow:inset 3px 0 var(--h)}.tbl tr.zone-rel td:first-child{box-shadow:inset 3px 0 var(--loss)}
.dots{display:inline-flex;gap:2px}.dots i{width:7px;height:7px;border-radius:50%;display:inline-block}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--soft);border-radius:10px;padding:8px 9px}
.tile .l{font-size:11px;color:var(--mute)}.tile .v{font:700 20px "Saira Condensed"}.tile .v small{font-size:12px;color:var(--mute);font-weight:500;margin-left:3px}
.tile .rk{font-size:11px;color:var(--mute)}
.gl{display:grid;grid-template-columns:44px 1fr auto auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.gl:last-child{border-bottom:0}
.res{width:22px;height:22px;border-radius:6px;color:#fff;font:700 12px "Saira Condensed";display:flex;align-items:center;justify-content:center}
.bars .b{display:grid;grid-template-columns:22px 92px 1fr 44px;gap:6px;align-items:center;margin:5px 0;font-size:13px}
.bars .tr{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.bars .tr i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bars .hl{font-weight:700;color:var(--acc)}
.big{font:700 32px "Saira Condensed"}
.note{font-size:12px;color:var(--mute);margin:14px 4px}
.sec{font-weight:700;margin:14px 2px 2px;font-size:15px}
.tl{margin:6px 0;font-size:13px}.tl .ev{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.tl .ev:last-child{border-bottom:0}.tl .m{text-align:center;font:600 13px "Saira Condensed";color:var(--mute)}.tl .h{text-align:right}.tl .ht{text-align:center;font-size:11px;color:var(--mute);padding:4px 0;background:var(--soft);border-radius:6px;margin:4px 0}
.ic{display:inline-block;width:10px;height:13px;border-radius:2px;vertical-align:-2px}.ic.y{background:#facc15}.ic.r{background:#dc2626}.ic.yr{background:linear-gradient(90deg,#facc15 50%,#dc2626 50%)}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}.lu .p{display:flex;gap:5px;align-items:center;padding:2px 0}.lu .no{width:20px;text-align:right;color:var(--mute);font-family:"Saira Condensed"}.lu .rt{margin-left:auto;font:600 12px "Saira Condensed";padding:0 4px;border-radius:4px;color:#fff}
.empty{padding:24px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header><div class="row"><h1>英超數據板 <span class="num">2026/27</span></h1><span class="sp"></span><button id="lang" class="chip" onclick="setLang(LANG=='zh'?'en':'zh')">中文</button></div><div class="sub" id="upd">載入中…</div></header>
<main id="app"></main>
<nav class="tabs">
 <a href="#week" data-t="week"><b>⚽</b>本週</a>
 <a href="#table" data-t="table"><b>🏆</b>積分榜</a>

</nav>
<script>
let LANG='en';try{localStorage.removeItem('lang')}catch(e){}
const EN_TEAM={ARS:'Arsenal',MCI:'Man City',CHE:'Chelsea',LIV:'Liverpool',MUN:'Man United',TOT:'Tottenham',AVL:'Aston Villa',BHA:'Brighton',BOU:'Bournemouth',BRE:'Brentford',COC:'Coventry',CRY:'Crystal Palace',EVE:'Everton',FUL:'Fulham',HUL:'Hull City',IPS:'Ipswich',LEE:'Leeds',NEW:'Newcastle',NFO:"Nott'm Forest",SUN:'Sunderland'};
const F=(o,k)=>{const e=o[k+'_en'];return LANG=='en'&&e&&(Array.isArray(e)?e.length:1)?e:o[k]};
function setLang(l){LANG=l;document.documentElement.lang=l=='en'?'en':'zh-Hant';if(D)updHeader();route();}
const RX=[[/第\s*(\d+)\s*輪/g,'Round $1'],[/第\s*(\d+)\s*位/g,'#$1'],[/AI 第(\d+)版/g,'AI v$1'],[/第(\d+)版/g,'v$1'],[/(\d+)勝(\d+)[和平](\d+)負/g,'$1W $2D $3L'],
 [/入(\d+) 失(\d+)/g,'GF $1 · GA $2'],[/(\d+) 分(?!鐘)/g,'$1 pts'],[/(\d+) 場 · 已完場 (\d+)/g,'$1 matches · $2 finished'],[/已完場 (\d+) 場的 AI 最後一版預測/g,'Final AI prediction for $1 finished matches'],
 [/主(\d+)\/[和平](\d+)\/客(\d+)/g,'H$1/D$2/A$3'],[/主(\d+)% [和平](\d+)% 客(\d+)%/g,'H$1% D$2% A$3%'],[/角([\d.]+)→/g,'Corners $1→'],
 [/半場形勢：主領先 (\d+)% · 平局 (\d+)% · 客領先 (\d+)%/g,'Half-time: home ahead $1% · level $2% · away ahead $3%'],[/^主 vs /,'H vs '],[/^客 vs /,'A vs '],
 [/每場平均 · /g,'Per match · '],[/半場 (\d+)-(\d+)/g,'HT $1-$2'],[/預測 (\d+-\d+)/g,'Pred. $1']];
const PH=[['所有預測只供參考，單場波動很大，不構成投注建議。時間為馬來西亞時間。AI 預測於本週第一場開賽前 1 小時發佈，之後每 12 小時及每場賽前 1 小時、30 分鐘檢查，有新資訊才修正。',"Predictions are for reference only, not betting advice. Times are Malaysia time (UTC+8). AI predictions are published 1 hour before the round's first match, then rechecked every 12 hours and 60 and 30 minutes before each kickoff; they change only when new information appears."],
 ['還沒有完場的 AI 預測。第一批預測完場後，這裏會統計命中率。','No finished matches with AI predictions yet. Hit rates will appear here once the first predicted matches finish.'],
 ['藍線：前四（歐冠資格）· 紅線：降級區。點球隊看詳情。','Blue: top 4 (Champions League) · Red: relegation zone. Tap a team for details.'],
 ['AI 預測未出（將於本週第一場開賽前 1 小時發佈）· 統計基準 ',"AI prediction pending (published 1h before the round's first match) · Baseline "],
 ['統計基準（賠率＋本季數據）：','Baseline (odds + season data): '],['；只用本季數據：','; season data only: '],
 ['（括號為 20 隊排名）','(rank of 20)'],['（馬來西亞時間）',' (MYT)'],['比賽結果（新→舊）','Results (newest first)'],['：已檢查，維持預測',': checked, no change'],
 ['半場領先/平/落後','HT lead/level/behind'],['大小2.5命中','O/U 2.5 hit'],['上半角球誤差','1H corners error'],['全場角球誤差','FT corners error'],['黃牌誤差','Yellows error'],['犯規誤差','Fouls error'],
 ['比分在前三','Score in top 3'],['比分全中','Exact score'],['勝負命中','Result hit'],['勝負中','Result ✓'],['勝負錯','Result ✗'],['本季每場平均','Per-match averages'],
 ['傷停／首發','Injuries / lineup'],['首發已公佈','XI confirmed'],['首發未公佈','XI not confirmed'],['預測紀錄','Prediction history'],['本版改動：','Changes: '],['下次注意：','Next time: '],
 ['數據更新：','Updated: '],['最後檢查','last check'],['點擊看詳情 ▾','Details ▾'],['尚未預測','Not predicted'],
 ['上半被角球','1H corners against'],['上半進球','1H goals'],['上半失球','1H conceded'],['上半犯規','1H fouls'],['上半角球','1H corners'],['上半黃牌','1H yellows'],
 ['全場犯規','FT fouls'],['全場角球','FT corners'],['全場黃牌','FT yellows'],['雙方進球','BTTS'],['被角球','Corners against'],['被犯規','Fouled'],['xG / 被xG','xG / xGA'],
 ['AI 預測','AI pred.'],['AI 分析','AI analysis'],['AI 覆盤','AI review'],['無傷停','No absentees'],['無進球','No goals'],['進球：','Goals: '],['(烏龍)','(OG)'],['(點球)','(pen)'],
 ['本週首次','first'],['12小時檢查','12h check'],['賽前1小時','T-60min'],['賽前30分鐘','T-30min'],['手動更新','manual'],['舊版模型','legacy'],['舊模型','legacy'],
 ['下一場','Next match'],['控球%','Poss %'],['控球','Poss'],['射門','Shots'],['射正','On target'],['越位','Offsides'],['紅牌','Reds'],
 ['裁判：','Referee: '],['裁判','Referee'],['查於','checked'],['首發','XI'],['半場','HT'],['完場','FT'],['進行中','LIVE'],['延期','Postponed'],['主勝','Home'],['客勝','Away'],['大2.5','O2.5'],
 ['角球','Corners'],['黃牌','Yellows'],['犯規','Fouls'],['進球','Goals'],['失球','Conceded'],['信心','Conf.'],['比分','Score'],['實際','Actual'],['近況','Form'],['得失','GD'],['球隊','Team']];
const EXACT={'平':'Draw','和':'Draw','賽':'P','勝':'W','負':'L','分':'Pts','#':'#'};
function i18n(){
  if(LANG!='en')return;
  const w=document.createTreeWalker(document.getElementById('app'),NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){let t=n.nodeValue;if(!/[\u4e00-\u9fff]/.test(t))continue;
    const tt=t.trim();if(EXACT[tt]){n.nodeValue=t.replace(tt,((tt=='和'||tt=='平')&&n.parentNode.closest('.tbl'))?'D':EXACT[tt]);continue;}
    for(const [r,e] of RX)t=t.replace(r,e);
    for(const [z,e] of PH)if(t.includes(z))t=t.split(z).join(e);
    t=t.replace(/\(缺/g,'(out').replace(/\(疑/g,'(doubt');
    n.nodeValue=t;}
}
function updHeader(){$('#upd').textContent=(LANG=='en'?'Updated: ':'數據更新：')+stamp(D.updated)+(LANG=='en'?' (MYT)':'（馬來西亞時間）')+(D.last_check?(LANG=='en'?' · last check ':' · 最後檢查 ')+stamp(D.last_check):'');$('#lang').textContent=LANG=='en'?'中文':'EN';
  document.querySelector('header h1').firstChild.nodeValue=LANG=='en'?'Premier League Board ':'英超數據板 ';
  document.querySelectorAll('nav.tabs a').forEach(a=>{a.lastChild.nodeValue=LANG=='en'?{week:'Week',table:'Table',team:'Teams',rank:'Rankings',acc:'Accuracy',sim:'Sim'}[a.dataset.t]:{week:'本週',table:'積分榜',team:'球隊',rank:'排行',acc:'準確度',sim:'模擬'}[a.dataset.t]});}

const COL={ARS:'#db0007',MCI:'#6cabdd',CHE:'#034694',LIV:'#c8102e',MUN:'#da291c',TOT:'#132257',AVL:'#670e36',BHA:'#0057b8',BOU:'#b50e12',BRE:'#e30613',COC:'#59cbe8',CRY:'#1b458f',EVE:'#003399',FUL:'#222',HUL:'#f5a12d',IPS:'#3a64a3',LEE:'#ffcd00',NEW:'#241f20',NFO:'#dd0000',SUN:'#eb172b'};
const DARKTXT={LEE:1,HUL:1,COC:1,MCI:1};
const MODE={legacy:'舊版模型',round:'本週首次',check:'12小時檢查',pre60:'賽前1小時',pre30:'賽前30分鐘',manual:'手動更新'};
let D,N,app=document.getElementById('app'),wk=null,rkKey='g',tmSel=null;
const $=s=>document.querySelector(s);
const tz='Asia/Kuala_Lumpur';
const fmt=(ts,o)=>new Intl.DateTimeFormat(LANG=='en'?'en-GB':'zh-Hant',Object.assign({timeZone:tz},o)).format(new Date(ts*1000));
const hm=ts=>fmt(ts,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const md=ts=>fmt(ts,{month:'numeric',day:'numeric'});
const dayLbl=ts=>fmt(ts,{month:'long',day:'numeric',weekday:'short'});
const stamp=ts=>md(ts)+' '+hm(ts);
const nm=c=>LANG=='en'?(EN_TEAM[c]||c):(N[c]||c);
const badge=c=>`<span class="badge" style="background:${COL[c]||'#666'};${DARKTXT[c]?'color:#111':''}">${c}</span>`;
const f1=x=>x==null?'–':(+x).toFixed(1);
const sum=a=>a&&a[0]!=null?(+a[0])+(+a[1]):null;
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function load(){
  const r=await fetch('data.json?t='+Date.now());D=await r.json();N=D.names;
  updHeader();
  route();
}
window.addEventListener('hashchange',route);
function route(){
  const h=(location.hash||'#week').slice(1).split('/');
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===h[0]));
  ({week:vWeek,table:vTable,team:vTeam,rank:vRank,acc:vAcc,sim:vSim}[h[0]]||vWeek)(h[1]);
  window.scrollTo(0,0);
  i18n();
}
const gameOf=id=>D.games.find(g=>g.id==id);
const latest=id=>{const p=D.predictions[id];return p&&p.versions.length?p.versions[p.versions.length-1]:null};

/* ---------- match card ---------- */
function outcome(a,b){return a>b?0:a==b?1:2}
function matchCard(e,open){
  const g=gameOf(e.id), v=latest(e.id), P=D.predictions[e.id], rv=D.reviews[e.id], pre=D.pre[e.id], bl=D.baseline[e.id];
  const live=e.status==='inprogress', fin=e.status==='finished';
  let st=fin?'<span class="tag ft">完場</span>':live?'<span class="tag live">進行中</span>':e.status==='postponed'?'<span class="tag bad">延期</span>':'';
  let mid;
  if(fin||live) mid=`<div class="score">${e.hs??''}-${e.as_??''}${e.hs1!=null?`<small>半場 ${e.hs1}-${e.as1}</small>`:''}</div>`;
  else mid=`<div class="score" style="font-size:20px">${hm(e.start)}${v?`<small>預測 ${v.score[0]}</small>`:''}</div>`;
  let hit='';
  if(fin&&v){const ok=outcome(e.hs,e.as_)==v.p.indexOf(Math.max(...v.p));const ex=v.score.includes(`${e.hs}-${e.as_}`);
    hit=` <span class="tag ${ok?'ok':'bad'}">${ok?'勝負中':'勝負錯'}</span>`+(v.score[0]==`${e.hs}-${e.as_}`?' <span class="tag ok">比分全中</span>':ex?' <span class="tag ok">比分在前三</span>':'');}
  const pv=v||null;
  const pb=pv?`<div class="pbar" style="margin-top:6px"><div class="ph" style="width:${pv.p[0]}%">${Math.round(pv.p[0])}%</div><div class="pd" style="width:${pv.p[1]}%">${Math.round(pv.p[1])}%</div><div class="pa" style="width:${pv.p[2]}%">${Math.round(pv.p[2])}%</div></div>

      o25:(v.over25>=50)==(g.ft[0]+g.ft[1]>2.5)});}
  const LS=(D.learn||{}).stats||{}, PB=(D.learn||{}).playbook||{};
  const en=LANG=='en';

  if(PB.rules&&PB.rules.length){
    learnH+=`<div class="mute xs">${en?'Prediction playbook v'+PB.version+' · updated '+stamp(PB.ts)+' (after round '+PB.round+')':'預測守則 第'+PB.version+'版 · '+stamp(PB.ts)+' 更新（第'+PB.round+'輪後）'}</div>`;
    if(PB.summary_zh)learnH+=`<div style="margin:6px 0"><b>${en?'Latest change: ':'最新改動：'}</b>${esc(en?PB.summary_en||PB.summary_zh:PB.summary_zh)}</div>`;
    learnH+=`<ol class="reasons">${PB.rules.map(r=>`<li>${esc(en?r.en||r.zh:r.zh)}<div class="xs mute">${esc(r.evidence||'')}</div></li>`).join('')}</ol>`;
  } else learnH+=`<div class="mute">${en?'After each round, the AI reviews every match, measures its own biases and rewrites a playbook of up to 10 rules. The playbook and its bias corrections are fed into every new prediction. The first playbook appears after round 9 finishes.':'每輪完場後，AI 會覆盤每一場、量度自己的偏差，再改寫最多 10 條預測守則。之後每次預測都會讀這份守則和偏差校正。第 9 輪踢完後會出第一版。'}</div>`;
  if(LS.n){
    const b=x=>x==null?'–':x.toFixed(3);
    learnH+=`<div class="sec" style="font-size:13px">${en?'Win/draw/loss probability score (Brier, lower is better)':'勝平負機率評分（Brier，越低越好）'}</div>
    <div class="kv"><span>AI<b>${b(LS.brier_ai)}</b></span><span>${en?'Baseline':'統計基準'}<b>${b(LS.brier_base)}</b></span><span>${en?'Market odds':'市場賠率'}<b>${b(LS.brier_mkt)}</b></span><span>${en?'Season data only':'只用本季數據'}<b>${b(LS.brier_model)}</b></span><span>${en?'Closing odds':'收盤賠率'}<b>${b(LS.brier_close)}</b></span></div>`;
    const M=LS.metrics||{};const NM={g:['FT goals','總進球'],g1:['1H goals','上半進球'],c1:['1H corners','上半角球'],c:['FT corners','全場角球'],f1:['1H fouls','上半犯規'],f:['FT fouls','全場犯規'],y1:['1H yellows','上半黃牌'],y:['FT yellows','全場黃牌']};
    if(Object.keys(M).length)learnH+=`<table class="cmp" style="margin-top:8px"><tr><th></th><th>${en?'Bias':'偏差'}</th><th>${en?'AI error':'AI 誤差'}</th><th>${en?'Baseline error':'基準誤差'}</th></tr>${Object.entries(M).map(([k,m])=>`<tr><td>${NM[k]?NM[k][en?0:1]:k}</td><td>${m.bias>0?'+':''}${m.bias}</td><td>±${m.mae}</td><td>${m.base_mae==null?'–':'±'+m.base_mae}</td></tr>`).join('')}</table><div class="xs mute" style="margin-top:4px">${en?'Bias: + means the AI over-predicts on average, − means under-predicts.':'偏差：正數代表 AI 平均高估，負數代表低估。'}</div>`;
    const C=LS.by_conf||{};if(Object.keys(C).length)learnH+=`<div class="kv" style="margin-top:8px">${Object.entries(C).map(([c,x])=>`<span>${en?{高:'High',中:'Med',低:'Low'}[c]+' conf.':'信心'+c}<b>${Math.round(x.hit*100)}%</b><span class="xs mute"> (${x.n})</span></span>`).join('')}</div>`;
  }
  learnH+='</div>';
  if(!rows.length){app.innerHTML='<div class="card empty">還沒有完場的 AI 預測。第一批預測完場後，這裏會統計命中率。</div>'+learnH;return;}
  const n=rows.length,pc=f=>Math.round(100*rows.filter(f).length/n),avg=k=>f1(rows.reduce((t,r)=>t+r[k],0)/n);
  let h=`<div class="card pad"><div class="small mute">已完場 ${n} 場的 AI 最後一版預測</div><div class="tiles" style="margin-top:8px">
   <div class="tile"><div class="l">勝負命中</div><div class="big">${pc(r=>r.ok)}%</div></div>
   <div class="tile"><div class="l">比分全中</div><div class="big">${pc(r=>r.ex)}%</div></div>
   <div class="tile"><div class="l">比分在前三</div><div class="big">${pc(r=>r.top3)}%</div></div>
   <div class="tile"><div class="l">大小2.5命中</div><div class="big">${pc(r=>r.o25)}%</div></div>
   <div class="tile"><div class="l">上半角球誤差</div><div class="big">±${avg('ec1')}</div></div>
   <div class="tile"><div class="l">全場角球誤差</div><div class="big">±${avg('ec')}</div></div>
   <div class="tile"><div class="l">黃牌誤差</div><div class="big">±${avg('ey')}</div></div>
   <div class="tile"><div class="l">犯規誤差</div><div class="big">±${avg('ef')}</div></div></div></div><div class="card">`;
  for(const r of rows.sort((a,b)=>b.g.start-a.g.start)){const g=r.g;
    h+=`<a class="gl" href="#week/${g.round}" style="color:inherit;text-decoration:none"><span class="small mute">${md(g.start)}</span><span>${nm(g.home)} <b class="num">${g.ft[0]}-${g.ft[1]}</b> ${nm(g.away)}<div class="xs mute">預測 ${r.v.score[0]} · 主${Math.round(r.v.p[0])}/平${Math.round(r.v.p[1])}/客${Math.round(r.v.p[2])}</div></span><span class="xs mute">角${f1(sum(r.v.c))}→${sum(g.c)}</span><span class="res ${r.ok?'W':'L'}">${r.ok?'✓':'✗'}</span></a>`;}
  app.innerHTML=h+'</div>'+learnH;
}

/* ---------- paper trading ---------- */
function vSim(){
  const P=D.paper||{},en=LANG=='en',T=P.total||{n:0};
  const MK={'1X2':['Win/draw/loss','勝平負'],'OU2.5':['Over/under 2.5','大小2.5球'],'BTTS':['Both teams score','雙方進球'],corners:['Corners line','角球大小'],cards:['Cards line','黃牌大小']};
  const pct=x=>x==null?'–':(x>0?'+':'')+Math.round(x*100)+'%';
  const u=x=>(x>0?'+':'')+(+x).toFixed(2);
  let h=`<div class="card pad small" style="border-color:var(--warn)">${en?'⚠️ Simulation only — no real money. A virtual 1-unit bet is placed whenever the AI\'s probability beats the bookmaker\'s odds by at least '+Math.round((P.edge||0.05)*100)+'%. Small samples swing wildly; this is a test of whether the AI has any edge, not advice.':'⚠️ 只是模擬，不涉及真錢。每當 AI 的機率比莊家賠率反映的高出 '+Math.round((P.edge||0.05)*100)+'% 以上，就虛擬下注 1 注。樣本少時結果波動很大；這只是測試 AI 有沒有優勢，不是投注建議。'}</div>`;
  h+=`<div class="card pad"><div class="tiles">
   <div class="tile"><div class="l">${en?'Bets':'注數'}</div><div class="big">${T.n}</div></div>
   <div class="tile"><div class="l">${en?'Profit (units)':'盈虧（注）'}</div><div class="big" style="color:${T.pnl>0?'var(--win)':T.pnl<0?'var(--loss)':'inherit'}">${T.n?u(T.pnl):'–'}</div></div>
   <div class="tile"><div class="l">${en?'ROI':'回報率'}</div><div class="big">${pct(T.roi)}</div></div>
   <div class="tile"><div class="l">${en?'Won':'贏'}</div><div class="big">${T.n?T.wins+'/'+T.n:'–'}</div></div>
   <div class="tile"><div class="l">${en?'Worst drawdown':'最大回落'}</div><div class="big">${T.n?u(T.max_dd):'–'}</div></div>
   <div class="tile"><div class="l">${en?'Longest losing run':'最長連輸'}</div><div class="big">${T.n?T.worst_streak:'–'}</div></div>
   <div class="tile"><div class="l">${en?'Avg. CLV':'平均 CLV'}</div><div class="big" style="color:${T.clv>0?'var(--win)':T.clv<0?'var(--loss)':'inherit'}">${pct(T.clv)}</div></div></div><div class="xs mute" style="margin-top:6px">${en?'CLV (closing line value): how much better our odds were than the final odds just before kickoff. Consistently positive CLV is the most reliable sign of a real edge.':'CLV（收盤價值）：我們下注時的賠率比開賽前最後一刻的收盤賠率好多少。長期保持正數，是有真正優勢最可靠的指標。'}</div>`;
  const c=P.curve||[];
  if(c.length>1){const mn=Math.min(0,...c),mx=Math.max(0,...c),W=320,H=90,sx=i=>i*W/(c.length-1),sy=y=>H-(y-mn)*H/((mx-mn)||1);
    h+=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100px;margin-top:10px"><line x1="0" x2="${W}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)"/><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${c.map((y,i)=>sx(i)+','+sy(y)).join(' ')}"/></svg><div class="xs mute">${en?'Cumulative profit (units)':'累積盈虧（注）'}</div>`;}
  h+='</div>';
  const tbl=(o,lab)=>{const e=Object.entries(o||{});if(!e.length)return '';return `<div class="sec">${lab}</div><div class="card"><table class="tbl"><tr><th style="text-align:left;padding-left:10px">${en?'Type':'類別'}</th><th>${en?'Bets':'注'}</th><th>${en?'Won':'贏'}</th><th>${en?'Profit':'盈虧'}</th><th>ROI</th></tr>${e.map(([k,x])=>`<tr><td class="tn" style="padding-left:10px">${k in MK?MK[k][en?0:1]:(en?{高:'High',中:'Med',低:'Low'}[k]+' conf.':'信心'+k)}</td><td>${x.n}</td><td>${x.wins}</td><td>${u(x.pnl)}</td><td>${pct(x.roi)}</td></tr>`).join('')}</table></div>`};
  h+=tbl(P.by_market,en?'By market':'按盤口')+tbl(P.by_conf,en?'By AI confidence':'按 AI 信心');
  const O=P.open||[];
  h+=`<div class="sec">${en?'Open virtual bets (upcoming)':'未開賽的模擬注'}</div><div class="card">`+(O.length?O.map(b=>`<div class="gl" style="grid-template-columns:44px 1fr auto"><span class="small mute">${md(b.start)}</span><span>${nm(b.home)} v ${nm(b.away)}<div class="xs"><b>${en?b.en:b.zh}</b> @ ${b.odds} · AI ${Math.round(b.p*100)}% · ${en?'edge':'優勢'} ${pct(b.edge)}</div></span><span class="tag ai">${en?'open':'待結算'}</span></div>`).join(''):`<div class="empty small">${en?'None — the AI does not currently disagree enough with the odds on any upcoming match.':'暫時沒有：AI 目前對未開賽的比賽，沒有跟賠率差得夠多的判斷。'}</div>`)+'</div>';
  const B=[...(P.bets||[])].reverse();
  if(B.length)h+=`<div class="sec">${en?'Settled bets':'已結算'}</div><div class="card">`+B.map(b=>`<div class="gl" style="grid-template-columns:44px 1fr auto auto"><span class="small mute">${md(b.start)}</span><span>${nm(b.home)} v ${nm(b.away)}<div class="xs"><b>${en?b.en:b.zh}</b> @ ${b.odds} · AI ${Math.round(b.p*100)}%</div></span><span class="num">${u(b.pnl)}</span><span class="res ${b.win==null?'D':b.win?'W':'L'}">${b.win==null?'–':b.win?'✓':'✗'}</span></div>`).join('')+'</div>';
  app.innerHTML=h;
}

/* ---------- timeline & lineups ---------- */
const VARZ={penaltyNotAwarded:'不判點球',penaltyAwarded:'判點球',goalAwarded:'進球有效',goalNotAwarded:'進球無效',redCard:'紅牌',noRedCard:'不出紅牌',cardUpgrade:'改判紅牌',mistakenIdentity:'認錯人'};
const VARE={penaltyNotAwarded:'no penalty',penaltyAwarded:'penalty given',goalAwarded:'goal stands',goalNotAwarded:'goal disallowed',redCard:'red card',noRedCard:'no red card',cardUpgrade:'card upgraded'};
const RSN={'Foul':'犯規','Argument':'爭拗','Time wasting':'拖延時間','Handball':'手球','Unsporting behaviour':'違反體育精神','Dissent':'不滿判決','Professional foul last man':'最後防線犯規','Simulation':'插水','Off the ball foul':'無球犯規','Entering field of play':'未經許可進場','Persistent fouling':'屢次犯規','Violent conduct':'暴力行為','Denying goal-scoring opportunity':'阻止明顯進球機會','Other':'其他'};
function tlHtml(g){
  if(!g.tl||!g.tl.length)return '';
  const en=LANG=='en',L=[];let htDone=false;
  const mm=x=>x[0]+(x[1]?'+'+x[1]:'')+"'";
  const CL={yellow:'y',red:'r',yellowRed:'yr'};
  for(const x of g.tl){
    if(!htDone&&x[0]>45){L.push(`<div class="ht">${en?'Half-time':'半場'} ${g.ht[0]}-${g.ht[1]}</div>`);htDone=true;}
    let t='';
    if(x[3]=='g')t=`⚽ <b>${esc(x[5]||'')}</b>${x[4]=='penalty'?(en?' (pen)':'（點球）'):x[4]=='ownGoal'?(en?' (OG)':'（烏龍）'):''} <span class="num">${x[7]}</span>${x[6]?`<div class="xs mute">${en?'Assist':'助攻'}: ${esc(x[6])}</div>`:''}`;
    else if(x[3]=='c')t=`<span class="ic ${CL[x[4]]||'y'}"></span> ${esc(x[5]||'')}${x[6]?`<span class="xs mute"> · ${esc(en?x[6]:(RSN[x[6]]||x[6]))}</span>`:''}`;
    else if(x[3]=='s')t=`🔄 <span style="color:var(--win)">▲ ${esc(x[5]||'')}</span><div class="xs" style="color:var(--loss)">▼ ${esc(x[6]||'')}${x[4]=='inj'?(en?' (injury)':'（受傷）'):''}</div>`;
    else if(x[3]=='v')t=`📺 VAR <span class="xs mute">${esc((en?VARE:VARZ)[x[4]]||x[4]||'')} ${esc(x[5]||'')}</span>`;
    L.push(x[2]=='H'?`<div class="ev"><div class="h">${t}</div><div class="m">${mm(x)}</div><div></div></div>`:`<div class="ev"><div></div><div class="m">${mm(x)}</div><div>${t}</div></div>`);
  }
  if(!htDone)L.push(`<div class="ht">${en?'Half-time':'半場'} ${g.ht[0]}-${g.ht[1]}</div>`);
  return `<details class="more"><summary class="small"><b>⏱️ ${en?'Match timeline':'比賽過程'}</b> <span class="xs mute">${en?'goals · assists · cards · subs':'進球 · 助攻 · 紅黃牌 · 換人'} ▾</span></summary><div class="tl">${L.join('')}</div></details>`;
}
function luHtml(g){
  if(!g.lu)return '';
  const en=LANG=='en';
  const rc=r=>r==null?'':`<span class="rt" style="background:${r>=7.5?'#16a34a':r>=6.8?'#65a30d':r>=6.3?'#d97706':'#dc2626'}">${(+r).toFixed(1)}</span>`;
  const subIn={},subOut={};for(const x of g.tl||[])if(x[3]=='s'){subIn[x[5]]=x[0];subOut[x[6]]=x[0];}
  const side=(k,c)=>{const S=g.lu[k];if(!S)return '<div></div>';const xi=S.p.filter(p=>!p[3]),bn=S.p.filter(p=>p[3]&&(p[6]||subIn[p[0]]!=null));
    const row=p=>`<div class="p"><span class="no">${p[1]??''}</span><span>${esc(p[0])}${p[4]?' (C)':''}${subOut[p[0]]!=null?` <span class="xs" style="color:var(--loss)">▼${subOut[p[0]]}'</span>`:''}${subIn[p[0]]!=null?` <span class="xs" style="color:var(--win)">▲${subIn[p[0]]}'</span>`:''}</span>${rc(p[5])}</div>`;
    return `<div><div class="row" style="margin-bottom:4px">${badge(c)}<b>${S.f||''}</b></div>${xi.map(row).join('')}${bn.length?`<div class="xs mute" style="margin-top:4px">${en?'Subs used':'替補上場'}</div>`+bn.map(row).join(''):''}</div>`;};
  return `<details class="more"><summary class="small"><b>👥 ${en?'Line-ups':'陣容'}</b> <span class="xs mute">${en?'XI · subs · ratings':'首發 · 替補 · 評分'} ▾</span></summary><div class="lu" style="margin-top:6px">${side('H',g.home)}${side('A',g.away)}</div><div class="xs mute" style="margin-top:4px">${en?'Ratings from Sofascore.':'評分來自 Sofascore。'}</div></details>`;
}

/* ---------- pre-match features ---------- */
const COMP={'Premier League':['EPL','英超'],'UEFA Champions League':['UCL','歐冠'],'UEFA Europa League':['UEL','歐聯杯'],'UEFA Conference League':['UECL','歐協聯'],'UEFA Europa Conference League':['UECL','歐協聯'],'EFL Cup':['EFL Cup','聯賽杯'],'FA Cup':['FA Cup','足總杯']};
const comp=c=>c?(COMP[c]?COMP[c][LANG=='en'?0:1]:c):'';
const TIER={'主力':'Key','輪換':'Rotation','替補':'Squad','後備':'Squad','未上陣':'Not played','未出場':'Not played'};
function featHtml(e){
  const F=D.feat||{},en=LANG=='en',id=String(e.id);if(e.status==='finished')return '';
  let h='';const R=F.elo||{};
  if(R[e.home]){const ep=(F.elo_p||{})[id];const rank=c=>Object.values(R).filter(v=>v>R[c]).length+1;
    h+=`<div class="small" style="margin-top:4px"><b>Elo</b> <span class="xs mute">${en?'long-term strength':'長期實力評分'}</span>：${nm(e.home)} <b class="num">${R[e.home]}</b> <span class="xs mute">#${rank(e.home)}</span> · ${nm(e.away)} <b class="num">${R[e.away]}</b> <span class="xs mute">#${rank(e.away)}</span>${ep?`<div class="xs mute">${en?'Elo-implied':'Elo 推算'} ${en?'H':'主'}${Math.round(ep[0])}/${en?'D':'平'}${Math.round(ep[1])}/${en?'A':'客'}${Math.round(ep[2])}</div>`:''}</div>`;}
  const rs=(F.rest||{})[id];
  if(rs){h+=`<div class="small" style="margin-top:6px"><b>${en?'Schedule':'賽程密度'}</b></div>`;
    for(const s of ['home','away']){const x=rs[s];if(!x)continue;const warn=x.rest!=null&&x.rest<4;
      h+=`<div class="xs">${nm(e[s])}：${en?'rest':'休息'} <b style="${warn?'color:var(--loss)':''}">${x.rest??'–'}${en?' days':' 天'}</b>${x.last_comp?` (${en?'last':'上一場'} ${comp(x.last_comp)} v ${nm(x.last_vs)})`:''} · ${en?'14-day games':'14天內'} ${x.games14}${en?'':' 場'}${x.next_days!=null?` · ${en?'next':'下一場'} ${x.next_days}${en?'d':'天後'} ${comp(x.next_comp)}${x.next_comp&&x.next_comp!='Premier League'?' ⚠️':''}`:''}</div>`;}}
  const ms=(F.missing||{})[id];
  if(ms&&(ms.home||ms.away)){h+=`<div class="small" style="margin-top:6px"><b>${en?'Absence impact':'缺陣影響'}</b> <span class="xs mute">${en?'(≈ number of regular starters missing)':'（約等於缺了幾個全勤主力）'}</span></div>`;
    for(const s of ['home','away']){const x=ms[s];if(!x||!x.list.length)continue;
      const key=x.list.filter(m=>m.tier=='主力'||m.g+m.a>0);
      h+=`<div class="xs">${nm(e[s])}：<b class="num" style="font-size:14px;${x.impact>=1?'color:var(--loss)':''}">${x.impact}</b> ${x.list.map(m=>`<span style="${m.tier=='主力'?'font-weight:700':''}">${esc(m.name)}</span><span class="mute">(${m.type=='missing'?(en?'out':'缺'):(en?'doubt':'疑')}·${en?TIER[m.tier]||m.tier:m.tier}${m.g||m.a?` · ${m.g}${en?'G':'球'} ${m.a}${en?'A':'助'}`:''})</span>`).join('、')}</div>`;}}
  const O=(F.odds||{})[id];
  if(O){const f=x=>{try{const [a,b]=String(x).split('/');return (+a/(+b||1)+1).toFixed(2)}catch(e){return '–'}};
    const first=O.open||(O.hist[0]||[])[1],cur=(O.hist[O.hist.length-1]||[])[1]||first;
    if(first&&cur){const arrow=(a,b)=>{const x=+f(a),y=+f(b);return y<x-0.02?'<span style="color:var(--win)">▼</span>':y>x+0.02?'<span style="color:var(--loss)">▲</span>':''};
      h+=`<div class="small" style="margin-top:6px"><b>${en?'Odds movement':'賠率走勢'}</b> <span class="xs mute">${en?'opening → now (▼ = market more confident)':'開盤 → 現在（▼ 代表市場更看好）'}</span></div>
      <div class="xs">${['1','X','2'].map((k,i)=>`${[en?'Home':'主勝',en?'Draw':'平',en?'Away':'客勝'][i]} ${f(first[k])} → <b>${f(cur[k])}</b>${arrow(first[k],cur[k])}`).join(' · ')}</div>`;}}
  return h?`<div class="sec" style="font-size:13px">📋 ${en?'Pre-match data':'賽前資料'}</div>${h}`:'';
}
load().catch(e=>{app.innerHTML='<div class="card empty">載入失敗：'+e+'</div>'});
</script>

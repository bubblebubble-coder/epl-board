function i18n(){
  if(LANG!='en')return;
  const w=document.createTreeWalker(document.getElementById('app'),NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){let t=n.nodeValue;if(!/[\u4e00-\u9fff]/.test(t))continue;

function ctxHtml(e){

    if(CV.rounds&&CV.rounds.length>1){const S=[['ai','AI','var(--acc)'],['base',en?'Baseline':'基準','#999'],['mkt',en?'Market':'市場','#d9a400'],['model',en?'Season only':'只用本季','#3aa66b']];
      const all=S.flatMap(x=>CV[x[0]]).filter(x=>x!=null),mn=Math.min(...all),mx=Math.max(...all),W=320,H=90,n=CV.rounds.length,sx=i=>i*W/(n-1),sy=y=>H-(y-mn)*H/((mx-mn)||1);
      learnH+=`<svg viewBox="0 -4 ${W} ${H+8}" style="width:100%;height:100px;margin-top:10px">${S.map(([k,_,c])=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${CV[k].map((y,i)=>y==null?'':sx(i)+','+sy(y)).filter(Boolean).join(' ')}"/>`).join('')}</svg><div class="xs mute">${en?'Cumulative win/draw/loss Brier by round (lower is better): ':'按輪次的累積勝平負 Brier（越低越好）：'}${S.map(([k,l,c])=>`<span style="color:${c}">■</span> ${l}`).join(' ')} · ${en?'rounds':'輪次'} ${CV.rounds[0]}–${CV.rounds[n-1]}</div>`;}
    else learnH+=`<div class="xs mute" style="margin-top:6px">${en?'A round-by-round curve appears once two rounds have finished.':'踢完兩輪後，這裏會顯示按輪次的累積曲線。'}</div>`;
    const RC=LS.recent||{};const rk=Object.entries(RC);
    if(rk.length)learnH+=`<div class="sec" style="font-size:13px">${en?'Recent bias (last '+rk[0][1].rounds+' rounds)':'近期偏差（最近 '+rk[0][1].rounds+' 輪）'}</div><div class="kv">${rk.map(([k,m])=>`<span>${NM[k]?NM[k][en?0:1]:k}<b style="${m.stable?red:''}">${m.bias>0?'+':''}${m.bias}</b></span>`).join('')}</div><div class="xs mute" style="margin-top:4px">${en?'+ over-predicts, − under-predicts. Red = the same direction for 3 rounds in a row and at least 0.3 — shown as a hint on match cards and fed to the AI.':'正數＝多估，負數＝少估。紅色＝連續 3 輪同一方向且至少 0.3，會在比賽卡上提示，也會告訴 AI。'}</div>`;
    const C=LS.by_conf||{};if(Object.keys(C).length)learnH+=`<div class="kv" style="margin-top:8px">${Object.entries(C).map(([c,x])=>`<span>${en?{高:'High',中:'Med',低:'Low'}[c]+' conf.':'信心'+c}<b>${Math.round(x.hit*100)}%</b><span class="xs mute"> (${x.n})</span></span>`).join('')}</div>`;
  }
  learnH+='</div>';
  if(!rows.length){app.innerHTML='<div class="card empty">還沒有完場的 AI 預測。第一批預測完場後，這裏會統計命中率。</div>'+learnH;return;}
  const n=rows.length,pc=f=>Math.round(100*rows.filter(f).length/n),avg=k=>f1(rows.reduce((t,r)=>t+r[k],0)/n);
  let h=`<div class="card pad"><div class="small mute">已完場 ${n} 場的 AI 最後一版預測</div><div class="tiles" style="margin-top:8px">
   <div class="tile"><div class="l">勝負命中</div><div class="big">${pc(r=>r.ok)}%</div></div>
   <div class="tile"><div class="l">比分全中</div><div class="big">${pc(r=>r.ex)}%</div></div>
   <div class="tile"><div class="l">比分在前三</div><div class="big">${pc(r=>r.top3)}%</div></div>
   <div class="tile"><div class="l">大小2.5命中</div><div class="big">${pc(r=>r.o25)}%</div></div>
   <div class="tile"><div class="l">上半角球誤差</div><div class="big">±${avg('ec1')}</div></div>
   <div class="tile"><div class="l">全場角球誤差</div><div class="big">±${avg('ec')}</div></div>
   <div class="tile"><div class="l">黃牌誤差</div><div class="big">±${avg('ey')}</div></div>
   <div class="tile"><div class="l">犯規誤差</div><div class="big">±${avg('ef')}</div></div></div></div><div class="card">`;
  for(const r of rows.sort((a,b)=>b.g.start-a.g.start)){const g=r.g;
    h+=`<a class="gl" href="#week/${g.round}" style="color:inherit;text-decoration:none"><span class="small mute">${md(g.start)}</span><span>${nm(g.home)} <b class="num">${g.ft[0]}-${g.ft[1]}</b> ${nm(g.away)}<div class="xs mute">預測 ${r.v.score[0]} · 主${Math.round(r.v.p[0])}/平${Math.round(r.v.p[1])}/客${Math.round(r.v.p[2])}</div></span><span class="xs mute">角${f1(sum(r.v.c))}→${sum(g.c)}</span><span class="res ${r.ok?'W':'L'}">${r.ok?'✓':'✗'}</span></a>`;}
  app.innerHTML=h+'</div>'+learnH;
}

/* ---------- sim glossary: tap a (?) for a plain-language explanation + examples ---------- */
// each entry: [title, explanation, [examples...]] for zh and en
const GL={
sim:{zh:['模擬注','不用真錢的虛擬下注。每注固定 1 單位（1 注），用來測試 AI 判斷的機率是不是比莊家賠率更準。只是測試，不是投注建議。',['AI 認為 Arsenal 主勝有 55%，賠率 2.10：0.55 × 2.10 − 1 = +15.5%，超過 5% 門檻，所以虛擬下 1 注。贏了賺 1.10 注，輸了虧 1 注。','AI 認為小2.5 有 45%，賠率 2.00：0.45 × 2.00 − 1 = −10%，沒有優勢，不下注。']],
 en:['Virtual bet','A pretend bet with no real money, always 1 unit, to test whether the AI\'s probabilities beat the bookmaker\'s odds. A test, not betting advice.',['AI gives Arsenal a 55% chance at odds 2.10: 0.55 × 2.10 − 1 = +15.5%, above the 5% bar, so 1 virtual unit is placed. A win pays +1.10 units, a loss costs 1 unit.','AI gives under 2.5 a 45% chance at odds 2.00: 0.45 × 2.00 − 1 = −10%, no edge, so no bet.']]},
edge:{zh:['優勢（值博率）','AI 機率 × 賠率 − 1。意思是：如果 AI 的機率是對的，平均每下 1 注能賺多少。賽前要 ≥5% 才下注，半場要 ≥8%（即時賠率變得快）。',['AI 50%、賠率 2.30：0.5 × 2.3 − 1 = +15% → 下注。','AI 30%、賠率 3.00：0.3 × 3 − 1 = −10% → 不下注。','AI 40%、賠率 2.60：+4%，有一點優勢但不到 5%，也不下注。']],
 en:['Edge','AI probability × odds − 1: the average profit per unit IF the AI\'s probability is right. Pre-match bets need ≥5%, half-time bets ≥8% (live odds move fast).',['AI 50% at odds 2.30: 0.5 × 2.3 − 1 = +15% → bet.','AI 30% at odds 3.00: 0.3 × 3 − 1 = −10% → no bet.','AI 40% at odds 2.60: +4%, a small edge but under 5%, so no bet.']]},
odds:{zh:['賠率','這裡都是「小數賠率」，已包含本金：下 1 注、贏了拿回「賠率」那麼多。',['賠率 2.50：贏了拿回 2.5，淨賺 1.5；輸了虧 1。','賠率 1.25：贏了只淨賺 0.25，通常是很熱門的選項。','賠率 9.00：贏了淨賺 8，通常是冷門。']],
 en:['Odds','Decimal odds, stake included: a 1-unit bet returns the odds if it wins.',['Odds 2.50: a win returns 2.5 (profit 1.5); a loss costs 1.','Odds 1.25: a win makes only 0.25, usually a strong favourite.','Odds 9.00: a win makes 8, usually a long shot.']]},
aip:{zh:['AI 機率','AI 認為這個選項發生的機率。亞洲盤有「走盤、贏一半」，這裡顯示的是換算後的等值機率。',['「AI 55%」= AI 認為 100 場類似的比賽大約 55 場會中。','AI 55% 但賠率 1.70（保本線 59%），AI 其實認為這注不划算，所以不會下。']],
 en:['AI probability','How likely the AI thinks the pick is. For Asian lines (pushes, half wins) it is shown as an equivalent probability.',['"AI 55%" = in 100 similar matches the AI expects about 55 wins.','AI 55% at odds 1.70 (break-even 59%): the AI thinks it is poor value, so no bet.']]},
be:{zh:['保本線','1 ÷ 賠率。猜中率長期要高過它才會賺錢，所以它就是「剛好不賺不虧」的猜中率。表格中是每注保本線的平均。',['賠率 2.00 → 保本線 50%：10 注要中 5 注以上才賺。','賠率 4.00 → 保本線 25%：4 注中 1 注就打平。','平局常見賠率 3.40 → 約 29%。']],
 en:['Break-even','1 ÷ odds: the hit rate you need just to break even. The table shows the average over the bets.',['Odds 2.00 → 50%: you must win more than 5 of 10.','Odds 4.00 → 25%: 1 win in 4 breaks even.','A typical draw at 3.40 → about 29%.']]},
hit:{zh:['猜中','已結算的注中贏的比例（走盤不算）。要和「保本線」比較才有意義，不能和 50% 比。',['10 注贏 6 注 → 猜中 60%。若保本線是 45%，表現很好。','平局猜中 20% 看起來很差，但若保本線只有 18%，其實是賺的。','猜中 55% 但保本線 60%（賠率約 1.67），長期還是虧。']],
 en:['Hit rate','Share of settled bets won (pushes excluded). Compare it with break-even, not with 50%.',['6 wins from 10 → 60%. If break-even is 45%, that is strong.','Draws hitting 20% looks bad, but with a break-even of 18% it is profitable.','55% hits with a 60% break-even (odds about 1.67) still loses money.']]},
bets:{zh:['注數','虛擬下了多少注。注數越多，結果越可靠。',['同一場可以有幾注，例如「小2.5」和「非雙方進球」各 1 注。','只有 20 注時，運氣影響很大；超過 50 注才開始有參考價值。']],
 en:['Bets','How many virtual bets were placed. More bets = more reliable results.',['One match can carry several, e.g. under 2.5 and BTTS No.','With only 20 bets luck dominates; 50+ starts to mean something.']]},
pnl:{zh:['盈虧（注）','把每注的輸贏加起來，單位是「注」。',['贏 1 注（賠率 2.20，+1.20），輸 2 注（−2）→ 盈虧 −0.80。','盈虧 +5：假設每注 100 元，就是賺了 500 元。']],
 en:['Profit (units)','All wins and losses added up, in units.',['One win at 2.20 (+1.20) and two losses (−2) → −0.80.','+5 units: at 100 per bet that would be +500.']]},
roi:{zh:['回報率（ROI）','盈虧 ÷ 注數，即平均每注賺或虧多少。',['40 注賺 +6 注 → +15%。','20 注虧 −4 注 → −20%。','即使 ROI 很高，注數少時也可能只是運氣，要看下面的「可能範圍」。']],
 en:['ROI','Profit ÷ bets: average gain or loss per unit staked.',['+6 units from 40 bets → +15%.','−4 units from 20 bets → −20%.','A high ROI on few bets can be luck; check the range below it.']]},
won:{zh:['贏','贏的注數 / 總注數。',['23/44 = 44 注中贏了 23 注。','亞洲盤「贏一半」也算贏；走盤不算贏也不算輸。']],
 en:['Won','Winning bets / all bets.',['23/44 = 23 of 44 bets won.','An Asian half-win counts as a win; a push counts as neither.']]},
dd:{zh:['最大回落','累積盈虧從最高點往下跌的最大幅度，表示過程中最難受的一段。',['先累積到 +8，後來跌到 +2 → 最大回落 −6。','一開始就連輸 4 注 → −4。']],
 en:['Worst drawdown','The biggest drop from a peak in cumulative profit: the most painful stretch.',['Up to +8, then down to +2 → drawdown −6.','Losing the first 4 bets in a row → −4.']]},
streak:{zh:['最長連輸','連續輸的最多注數。',['輸、輸、輸、贏、輸 → 3。','專下冷門（賠率 6 以上）時，連輸 10 注是正常的。']],
 en:['Longest losing run','Most losses in a row.',['L, L, L, W, L → 3.','Backing long shots (odds 6+), 10 losses in a row is normal.']]},
clv:{zh:['CLV（收盤價值）','我們的賠率 ÷ 開賽前最後的賠率（收盤賠率）− 1。正數表示之後市場往我們的方向移動，是判斷有沒有真本事最可靠的指標。',['鎖定 2.40，收盤 2.10 → +14%：市場後來同意我們。','鎖定 2.00，收盤 2.20 → −9%：市場往反方向走。','長期 CLV 正數，就算短期輸錢，通常也代表判斷有價值。']],
 en:['CLV (closing line value)','Our odds ÷ the final pre-kickoff odds − 1. Positive = the market later moved our way, the most reliable sign of real skill.',['Locked 2.40, closed 2.10 → +14%: the market came round to us.','Locked 2.00, closed 2.20 → −9%: it moved against us.','Steady positive CLV usually means real value, even through losing spells.']]},
cov:{zh:['收盤賠率覆蓋率','有多少已完場比賽成功抓到開賽前最後一刻的賠率。抓不到就算不出 CLV。',['50 場中 46 場有 → 92%，CLV 可信。','低於 80%：常漏抓，CLV 數字要打折扣。']],
 en:['Closing-odds coverage','How many finished matches have the last pre-kickoff odds recorded. Without them, CLV can\'t be computed.',['46 of 50 → 92%, CLV is trustworthy.','Below 80%: often missed, take CLV with a grain of salt.']]},
band:{zh:['回報率可能範圍（運氣波動區間）','根據目前的輸贏波動，估計「真正」回報率大概落在哪裡（95% 把握）。範圍包含 0，表示還不能排除只是運氣。',['30 注 ROI +20%，範圍 −25% 至 +65% → 包含 0，還不能說有優勢。','300 注 ROI +6%，範圍 +1% 至 +11% → 整段都在 0 以上，比較可信。']],
 en:['ROI range (luck band)','Where the "true" ROI probably lies (95%), given how much results swing. If it includes 0, luck can\'t be ruled out.',['30 bets at +20%, range −25% to +65% → includes 0, no proven edge yet.','300 bets at +6%, range +1% to +11% → all above 0, more convincing.']]},
conf:{zh:['AI 信心','AI 對自己那場預測的把握：高、中、低。用來檢查 AI 的自信可不可靠。',['高：首發確定、資訊一致；低：傷病不明、兩隊很接近。','如果「高」的 ROI 反而比「低」差，代表 AI 的自信不可靠。']],
 en:['AI confidence','How sure the AI is about that match: high, medium, low. Used to check whether its confidence means anything.',['High: confirmed line-ups, consistent info. Low: unclear injuries, evenly matched.','If high-confidence bets do worse than low ones, the AI\'s confidence is not reliable.']]},
lead:{zh:['賽前 X 小時','下這注時距離開賽還有多久。',['「賽前 20 小時」：前一天就鎖定了這注。','「賽前 0.5 小時」：首發公佈後才出現的判斷。']],
 en:['Hours before kickoff','How long before kickoff the bet was taken.',['"20h before": locked the day before.','"0.5h before": a call made after the line-ups came out.']]},
push:{zh:['走盤','結果剛好在盤口線上，退回本金，不輸不贏。',['角球大小 10，全場剛好 10 個角球 → 退回本金。','讓球主 −1，主隊剛好贏 1 球 → 退回本金。']],
 en:['Push','The result lands exactly on the line: stake returned, no win or loss.',['Corners line 10 and exactly 10 corners → stake back.','Home −1 and the home side wins by exactly 1 → stake back.']]},
status:{zh:['未開賽／比賽中／已結算','未開賽：已決定的虛擬注，等比賽開始。比賽中：已開賽、還沒算輸贏。已結算：完場後已算好輸贏。',['未開賽的注在開賽前可能被取消（臨場版 AI 改變判斷時）。','完場後要等統計數據（例如角球數）齊全才會結算。']],
 en:['Upcoming / in play / settled','Upcoming: decided, waiting for kickoff. In play: started, not settled yet. Settled: result counted.',['An upcoming "final" pick can disappear if the AI changes its mind before kickoff.','A finished match settles once its stats (e.g. corners) are in.']]},
first:{zh:['首注（鎖定）','AI 第一次判斷某選項有優勢時，就用當時的賠率記下，之後不再改。最公平地測試 AI 是不是比市場早看到。',['開賽前 20 小時 AI 說小2.5 有優勢，鎖定賠率 2.40；之後賠率跌到 2.10，仍按 2.40 結算（CLV +14%）。','鎖定後 AI 改變主意，這注仍保留，不會取消。']],
 en:['First bet (locked)','Taken at the odds when the AI FIRST saw an edge, never changed afterwards: the fairest test of whether it spots value before the market.',['20h before kickoff the AI likes under 2.5 at 2.40; the odds later drop to 2.10, the bet still settles at 2.40 (CLV +14%).','If the AI later changes its mind, the bet stays.']]},
final:{zh:['臨場版','只看開賽前最後一版 AI 預測和當時的賠率。',['首發公佈後 AI 把主勝從 50% 降到 44%，若優勢消失，臨場版就沒有這注（首注可能還有）。','開賽前 30 分鐘的賠率已接近收盤，所以這裡的 CLV 通常接近 0。']],
 en:['Final pre-kickoff','Uses only the last AI version before kickoff and the odds at that time.',['After the line-ups the AI cuts the home win from 50% to 44%; if the edge is gone, this track has no bet (the first-bet track may still have one).','Odds 30 min before kickoff are near closing, so CLV here is usually near 0.']]},
h1:{zh:['上半場注','賽前下注、只看上半場 45 分鐘結果的注項：上半場勝平負、上半場大小球。和全場注分開計算盈虧。可選「首注」（第一次出現優勢時鎖定的賠率）或「臨場版」（開賽前最後一版）。',['賽前 AI 認為上半場打平有 45%，賠率 2.40：0.45 × 2.4 − 1 = +8% → 下注；半場 0-0 即贏。','上半場小1.25：半場 0-0 全贏，1-0 輸一半，2 球以上全輸。']],
 en:['1st-half bets','Pre-match bets settled on the first 45 minutes only: 1st-half 1X2 and 1st-half goals. Counted separately from full-time bets. Pick "First bet" (odds locked when the edge first appeared) or "Final" (last version before kickoff).',['AI gives a 1st-half draw 45% at odds 2.40: 0.45 × 2.4 − 1 = +8% → bet; 0-0 at HT wins.','1st-half under 1.25: 0-0 at HT wins in full, 1-0 loses half, 2+ goals loses.']]},
ht:{zh:['半場時下注（看全場結果）','中場休息時，AI 看完上半場再更新全場判斷，對比當時的即時賠率，優勢要 ≥8% 才下注。',['半場 0-0 但主隊射門 12 比 2，AI 認為主勝仍有 50%，即時賠率 2.50 → +25% → 下注。','半場 1-0，全場進球盤 1.75，AI 預期下半場只剩 0.6 球 → 可能下小。']],
 en:['Placed at half-time (full-time result)','At the break the AI reviews the first half and updates its full-time call, compared with live odds; needs an edge of 8%+.',['0-0 at HT but home shots 12-2; AI still gives the home win 50%, live odds 2.50 → +25% → bet.','1-0 at HT, full-time goals line 1.75, AI expects only 0.6 more goals → may back the under.']]},
cs:{zh:['正確比分（優勢注／AI 首選比分）','猜全場最終比分。優勢注：AI 機率 ≥5% 且優勢 ≥10% 才下（莊家抽水高）。AI 首選比分：每場固定買 AI 認為最可能的比分，用來看命中率。',['AI 認為 1-0 有 12%，賠率 9.0：0.12 × 9 − 1 = +8%，不到 10%，不下。','AI 首選 1-1，賠率 6.5，每場都買；命中率通常只有一至一成半。']],
 en:['Correct score (value / AI top score)','Predicting the exact final score. Value: AI chance ≥5% and edge ≥10% (big bookmaker margin). Top score: always 1 unit on the AI\'s most likely score, to track hit rate.',['AI gives 1-0 12% at odds 9.0: 0.12 × 9 − 1 = +8%, under 10%, no bet.','AI top pick 1-1 at 6.5 every match; hit rates are usually only 10–15%.']]},
'1X2':{zh:['勝平負','猜全場（90 分鐘加補時，不含加時）結果：主勝、平局或客勝。',['買「主勝」：主隊贏才中，2-1、1-0 都中。','買「平局」：1-1、0-0 都中。']],
 en:['Win / draw / loss','Full-time result (90 min + stoppage, no extra time): home, draw or away.',['"Home": wins only if the home side wins, e.g. 2-1 or 1-0.','"Draw": 1-1 and 0-0 both win.']]},
'OU2.5':{zh:['大小2.5球','猜全場總進球超過 2.5（3 球或以上）還是低於 2.5（2 球或以下）。固定用 2.5 這條線。',['2-1（3 球）→ 大中。','1-1（2 球）→ 小中。','0-0 → 小中。']],
 en:['Over/under 2.5','Total goals over 2.5 (3+) or under 2.5 (0-2). Always the 2.5 line.',['2-1 (3 goals) → over wins.','1-1 (2 goals) → under wins.','0-0 → under wins.']]},
goals_main:{zh:['主盤大小球','和大小2.5 一樣猜總進球，但用莊家「最平衡」的那條線（兩邊賠率最接近），實力懸殊時常常是 3.5。',['Barcelona 主場打弱旅，主盤 3.5：3-0（3 球）→ 小中；4-1 → 大中。','一般強強對話主盤 2.5，那就和大小2.5 是同一個判斷。']],
 en:['Main goals line','Same as over/under, but on the bookmaker\'s most balanced line (odds closest on both sides), often 3.5 in lopsided games.',['Barcelona at home to a minnow, main line 3.5: 3-0 → under wins; 4-1 → over wins.','In an even game the main line is often 2.5, i.e. the same call as over/under 2.5.']]},

    final:['Uses the last AI version before kickoff (on average '+(T.avg_lead??'–')+' h before). Late versions see confirmed line-ups, but their odds are already close to the closing odds, so CLV here says little.','用開賽前最後一版 AI 預測（平均開賽前 '+(T.avg_lead??'–')+' 小時）。臨場版看得到正式首發，但賠率已接近收盤賠率，所以這裡的 CLV 參考價值不大。'],

  TX.cs=[`A separate section, kept out of the other three tracks and with no CLV. Odds: ${C0.bk||'bet365'} correct-score odds via Flashscore (Sofascore has none), snapshot closest to the last AI version before kickoff. The AI's chance for each score comes from its expected goals, adjusted to match its win/draw/loss call. <b>Value picks</b>: any score where the AI's chance is at least ${Math.round((C0.min_p||0.05)*100)}% and beats the odds by ${Math.round((C0.edge||0.1)*100)}%+ (stricter, because bookmakers keep a big margin on this market). <b>AI top score</b>: always 1 unit on the AI's most likely score, as a hit-rate reference.`,
    `獨立的一區，不和其他三個區合併計算，也不計 CLV。賠率：經 Flashscore 取得的 ${C0.bk||'bet365'} 正確比分賠率（Sofascore 沒有這個盤口），用最接近開賽前最後一版 AI 預測時間的那一次。每個比分的 AI 機率，由 AI 的預計進球推算，再調整到與 AI 的勝平負判斷一致。<b>優勢注</b>：AI 機率至少 ${Math.round((C0.min_p||0.05)*100)}%，而且比賠率高出 ${Math.round((C0.edge||0.1)*100)}% 以上才下注（莊家在這個盤口抽水很高，所以門檻較嚴）。<b>AI 首選比分</b>：每場固定買 AI 認為最可能的比分 1 注，用來看命中率。`];
  const CKN={value:['Value picks','優勢注'],top:['AI top score','AI 首選比分']};
  const chip=k=>`<a class="chip ${k==TR?'on':''}" href="javascript:void 0" onclick="SIMT='${k}';vSim()">${TN[k][en?0:1]}${q(k)}</a>`;
  let h=[[['Full time','全場'],['first','final']],[['Half','半場'],['h1','ht']],[['Other','其他'],['cs']]].map(([l,ks])=>`<div class="chips" style="margin-bottom:6px;align-items:center"><span class="xs mute" style="white-space:nowrap;min-width:34px">${l[en?0:1]}</span>${ks.map(chip).join(' ')}</div>`).join('')+(H1?`<div class="chips" style="margin-bottom:8px;align-items:center"><span class="xs mute" style="white-space:nowrap">${en?'1st-half version':'上半場版本'}</span>${['first','final'].map(k=>`<a class="chip ${k==H1V?'on':''}" href="javascript:void 0" onclick="H1V='${k}';vSim()">${TN[k][en?0:1]}${q(k)}</a>`).join(' ')}</div>`:'')+(CS?`<div class="chips" style="margin-bottom:8px">${Object.keys(CKN).map(k=>`<a class="chip ${k==CSK?'on':''}" href="javascript:void 0" onclick="CSK='${k}';vSim()">${CKN[k][en?0:1]}${q('cs')}</a>`).join(' ')}</div>`:'')+`<div class="card pad small">${TX[TR][en?0:1]}</div>`+sfBox(P0,en);
  if(CS&&CSK=='top')h+=`<div class="card pad small" style="border-color:var(--warn)">${en?'⚠️ Simulation only — no real money. 1 virtual unit on the AI\'s most likely score in every match, whatever the odds. Correct scores rarely hit (often 10–15%), so long losing runs are normal.':'⚠️ 只是模擬，不涉及真錢。每場不論賠率，都虛擬買 AI 認為最可能的比分 1 注。正確比分命中率本來就低（通常只有一至一成半），連輸很多場是正常的。'}</div>`;
  else h+=`<div class="card pad small" style="border-color:var(--warn)">${en?'⚠️ Simulation only — no real money. A virtual 1-unit bet is placed whenever the AI\'s probability beats the bookmaker\'s odds by at least '+Math.round((P.edge||0.05)*100)+'%. Small samples swing wildly; this is a test of whether the AI has any edge, not advice.'+q('sim')+q('edge'):'⚠️ 只是模擬，不涉及真錢。每當 AI 的機率比莊家賠率反映的高出 '+Math.round((P.edge||0.05)*100)+'% 以上，就虛擬下注 1 注。樣本少時結果波動很大；這只是測試 AI 有沒有優勢，不是投注建議。'+q('sim')+q('edge')}</div>`;
  h+=`<div class="card pad"><div class="tiles">

   <div class="tile"><div class="l">${en?'ROI':'回報率'}${q('roi')}</div><div class="big">${pct(T.roi)}</div></div>

   <div class="tile"><div class="l">${en?'Worst drawdown':'最大回落'}${q('dd')}</div><div class="big">${T.n?u(T.max_dd):'–'}</div></div>
   <div class="tile"><div class="l">${en?'Longest losing run':'最長連輸'}${q('streak')}</div><div class="big">${T.n?T.worst_streak:'–'}</div></div>
   ${NOCLV?'':`<div class="tile"><div class="l">${en?'Avg. CLV':'平均 CLV'}${q('clv')}</div><div class="big" style="color:${T.clv>0?'var(--win)':T.clv<0?'var(--loss)':'inherit'}">${pct(T.clv)}</div></div>`}</div>${NOCLV?'':`<div class="xs mute" style="margin-top:6px">${en?'CLV (closing line value): how much better our odds were than the final odds just before kickoff. Consistently positive CLV is the most reliable sign of a real edge.':'CLV（收盤價值）：我們下注時的賠率比開賽前最後一刻的收盤賠率好多少。長期保持正數，是有真正優勢最可靠的指標。'}</div>`}`;
  const CI=T.roi_ci,CO=P.coverage||{},MN=P.min_n||50;
  if(T.n<MN)h+=`<div class="small" style="margin-top:8px;color:var(--warn)">⚠️ ${en?`Only ${T.n} bets so far — need roughly ${MN}+ before the result means anything.`:`目前只有 ${T.n} 注，至少約 ${MN} 注以上才有參考價值。`}${CI?(en?` Likely ROI range (luck band): ${pct(CI[0])} to ${pct(CI[1])}.`:` 回報率可能範圍（運氣波動區間）：${pct(CI[0])} 至 ${pct(CI[1])}。`)+q('band'):''}</div>`;
  else if(CI)h+=`<div class="xs mute" style="margin-top:8px">${en?`ROI range (95% luck band): ${pct(CI[0])} to ${pct(CI[1])}`:`回報率可能範圍（95% 運氣波動區間）：${pct(CI[0])} 至 ${pct(CI[1])}`}${q('band')}</div>`;
  if(CO.n&&!NOCLV){const r=CO.have/CO.n;h+=`<div class="xs" style="margin-top:4px;${r<0.8?'color:var(--loss)':''}">${en?`Closing-odds coverage: ${CO.have}/${CO.n} finished matches (recorded since ${md(CO.since)})`:`收盤賠率覆蓋率：${CO.have}/${CO.n} 場（${md(CO.since)} 起記錄）`}${q('cov')}${r<0.8?(en?' — below 80%, the last pre-kickoff odds scrape is being missed.':' — 低於 80%，開賽前最後一次抓賠率常常漏掉。'):''} · ${en?'CLV available for':'有 CLV 的注數'} ${T.n_clv||0}/${T.n}</div>`;}
  const c=P.curve||[];
  if(c.length>1){const mn=Math.min(0,...c),mx=Math.max(0,...c),W=320,H=90,sx=i=>i*W/(c.length-1),sy=y=>H-(y-mn)*H/((mx-mn)||1);
    h+=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100px;margin-top:10px"><line x1="0" x2="${W}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)"/><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${c.map((y,i)=>sx(i)+','+sy(y)).join(' ')}"/></svg><div class="xs mute">${en?'Cumulative profit (units)':'累積盈虧（注）'}</div>`;}
  h+='</div>';
  const tbl=(o,lab)=>{const e=Object.entries(o||{});if(!e.length)return '';return `<div class="sec">${lab}</div><div class="card"><table class="tbl"><tr><th style="text-align:left;padding-left:10px">${en?'Type':'類別'}</th><th>${en?'Bets':'注'}</th><th>${en?'Won':'贏'}</th><th>${en?'Profit':'盈虧'}</th><th>ROI</th></tr>${e.map(([k,x])=>`<tr><td class="tn" style="padding-left:10px">${k in MK?MK[k][en?0:1]+q(k):(en?{高:'High',中:'Med',低:'Low'}[k]+' conf.':'信心'+k)+q('conf')}</td><td>${x.n}</td><td>${x.wins}</td><td>${u(x.pnl)}</td><td>${pct(x.roi)}</td></tr>`).join('')}</table></div>`};
  h+=(CS?'':tbl(P.by_market,en?'By market':'按盤口')+kindTbl(P.bets||[],en)+`<div class="xs mute" style="margin:6px 2px 0">${en?'Markets added 26 Nov 2026 (no extra AI cost, derived from the AI\'s existing numbers): main goals line (the bookmaker\'s most balanced line, e.g. 3.5 in lopsided games; the 2.5 line is kept separately), double chance, Asian handicap (bet365 main line), 1st-half 1X2, 1st-half goals (22Bet main line). 1st-half corners: no bookmaker odds available from our sources, so not simulated.':'2026-11-26 新增注項（不用額外 AI，由 AI 現有數字推算）：主盤大小球（莊家最平衡的那條線，例如實力懸殊時是 3.5；原有的 2.5 另外保留）、雙重機會、亞洲讓球（bet365 主盤）、上半場勝平負、上半場大小球（22Bet 主盤）。上半場角球：我們的資料來源沒有這個盤口的賠率，所以無法模擬。'}</div>`)+tbl(P.by_conf,en?'By AI confidence':'按 AI 信心');
  const O=(CS?sfPool(X=>(X.cs||{}).open).filter(b=>b.kind==CSK):BT=='first'?sfPool(X=>X.open_first).filter(phOk):BT=='final'?sfPool(X=>X.open).filter(phOk):null)?.filter(sfOk)||null;
  if(O)h+=`<div class="sec">${en?'Open virtual bets (upcoming)':'未開賽的模擬注'}${q('status')}${q('odds')}${q('aip')}</div><div class="card">`+(O.length?O.map(b=>`<div class="gl" ${goM(b)} style="grid-template-columns:64px 1fr auto"><span class="small mute" style="line-height:1.25">${md(b.start)}<br>${hm12(b.start)}</span><span>${bn(b,0)} v ${bn(b,1)}${LT(b)}<div class="xs"><b>${en?b.en:b.zh}</b> @ ${b.odds} · AI ${Math.round(b.p*100)}% · ${en?'edge':'優勢'} ${pct(b.edge)}</div></span><span class="tag ai">${en?'open':'待結算'}</span></div>`).join(''):`<div class="empty small">${en?'None — the AI does not currently disagree enough with the odds on any upcoming match.':'暫時沒有：AI 目前對未開賽的比賽，沒有跟賠率差得夠多的判斷。'}</div>`)+'</div>';
  const LV=(CS?sfPool(X=>(X.cs||{}).live).filter(b=>b.kind==CSK):sfPool(X=>X.live).filter(b=>(b.track||'final')==BT&&phOk(b))).filter(sfOk);
  if(LV.length)h+=`<div class="sec">${en?'Virtual bets in play':'比賽中的模擬注'}${q('status')}</div><div class="card">`+LV.map(b=>`<div class="gl" ${goM(b)} style="grid-template-columns:64px 1fr auto"><span class="small mute" style="line-height:1.25">${md(b.start)}<br>${hm12(b.start)}</span><span>${bn(b,0)} <b class="num">${b.hs??'–'}-${b.as_??'–'}</b> ${bn(b,1)}${LT(b)}<div class="xs"><b>${en?b.en:b.zh}</b> @ ${b.odds} · AI ${Math.round(b.p*100)}% · ${en?'edge':'優勢'} ${pct(b.edge)}</div></span><span class="tag ai">${b.status=='finished'?(en?'FT · settling':'完場・結算中'):(b.desc&&/half/i.test(b.desc)&&!/1st|2nd/i.test(b.desc)?(en?'HT':'半場'):(en?'LIVE':'進行中'))}</span></div>`).join('')+'</div>';
  const B=[...(P.bets||[])].reverse();
  if(B.length)h+=`<div class="sec">${en?'Settled bets':'已結算'}${q('status')}${q('odds')}${q('aip')}${q('clv')}${q('lead')}${q('push')}</div><div class="card">`+B.map(b=>`<div class="gl" ${goM(b)} style="grid-template-columns:64px 1fr auto auto"><span class="small mute" style="line-height:1.25">${md(b.start)}<br>${hm12(b.start)}</span><span>${bn(b,0)} v ${bn(b,1)}${LT(b)}<div class="xs"><b>${en?b.en:b.zh}</b> @ ${b.odds} · AI ${Math.round(b.p*100)}%${b.clv!=null?' · CLV '+pct(b.clv):''}${b.bk?' · '+b.bk:''}${b.lead!=null?(en?' · '+b.lead+'h before':' · 賽前 '+b.lead+' 小時'):''}</div></span><span class="num">${u(b.pnl)}</span><span class="res ${b.win==null?'D':b.win?'W':'L'}">${b.win==null?'–':b.win?'✓':'✗'}</span></div>`).join('')+'</div>';

const VARZ={penaltyNotAwarded:'不判點球',penaltyAwarded:'判點球',goalAwarded:'進球有效',goalNotAwarded:'進球無效',redCard:'紅牌',noRedCard:'不出紅牌',cardUpgrade:'改判紅牌',mistakenIdentity:'認錯人'};

function tlHtml(g){
  if(!g.tl||!g.tl.length)return '';
  const en=LANG=='en',L=[];let htDone=false;
  const mm=x=>x[0]+(x[1]?'+'+x[1]:'')+"'";
  const CL={yellow:'y',red:'r',yellowRed:'yr'};
  for(const x of g.tl){
    if(!htDone&&x[0]>45){L.push(`<div class="ht">${en?'Half-time':'半場'} ${g.ht[0]}-${g.ht[1]}</div>`);htDone=true;}
    let t='';
    if(x[3]=='g')t=`⚽ <b>${esc(x[5]||'')}</b>${x[4]=='penalty'?(en?' (pen)':'（點球）'):x[4]=='ownGoal'?(en?' (OG)':'（烏龍）'):''} <span class="num">${x[7]}</span>${x[6]?`<div class="xs mute">${en?'Assist':'助攻'}: ${esc(x[6])}</div>`:''}`;
    else if(x[3]=='c')t=`<span class="ic ${CL[x[4]]||'y'}"></span> ${esc(x[5]||'')}${x[6]?`<span class="xs mute"> · ${esc(en?x[6]:(RSN[x[6]]||x[6]))}</span>`:''}`;
    else if(x[3]=='s')t=`🔄 <span style="color:var(--win)">▲ ${esc(x[5]||'')}</span><div class="xs" style="color:var(--loss)">▼ ${esc(x[6]||'')}${x[4]=='inj'?(en?' (injury)':'（受傷）'):''}</div>`;
    else if(x[3]=='v')t=`📺 VAR <span class="xs mute">${esc((en?VARE:VARZ)[x[4]]||x[4]||'')} ${esc(x[5]||'')}</span>`;
    L.push(x[2]=='H'?`<div class="ev"><div class="h">${t}</div><div class="m">${mm(x)}</div><div></div></div>`:`<div class="ev"><div></div><div class="m">${mm(x)}</div><div>${t}</div></div>`);
  }
  if(!htDone)L.push(`<div class="ht">${en?'Half-time':'半場'} ${g.ht[0]}-${g.ht[1]}</div>`);
  return `<details class="more"><summary class="small"><b>⏱️ ${en?'Match timeline':'比賽過程'}</b> <span class="xs mute">${en?'goals · assists · cards · subs':'進球 · 助攻 · 紅黃牌 · 換人'} ▾</span></summary><div class="tl">${L.join('')}</div></details>`;
}
function luHtml(g){
  if(!g.lu)return '';
  const en=LANG=='en';
  const rc=r=>r==null?'':`<span class="rt" style="background:${r>=7.5?'#16a34a':r>=6.8?'#65a30d':r>=6.3?'#d97706':'#dc2626'}">${(+r).toFixed(1)}</span>`;
  const subIn={},subOut={};for(const x of g.tl||[])if(x[3]=='s'){subIn[x[5]]=x[0];subOut[x[6]]=x[0];}

    const row=p=>`<div class="p"><span class="no">${p[1]??''}</span><span>${esc(p[0])}${p[4]?' (C)':''}${subOut[p[0]]!=null?` <span class="xs" style="color:var(--loss)">▼${subOut[p[0]]}'</span>`:''}${subIn[p[0]]!=null?` <span class="xs" style="color:var(--win)">▲${subIn[p[0]]}'</span>`:''}</span>${rc(p[5])}</div>`;
    return `<div><div class="row" style="margin-bottom:4px">${badge(c)}<b>${S.f||''}</b></div>${xi.map(row).join('')}${bn.length?`<div class="xs mute" style="margin-top:4px">${en?'Subs used':'替補上場'}</div>`+bn.map(row).join(''):''}</div>`;};
  return `<details class="more"><summary class="small"><b>👥 ${en?'Line-ups':'陣容'}</b> <span class="xs mute">${en?'XI · subs · ratings':'首發 · 替補 · 評分'} ▾</span></summary><div class="lu" style="margin-top:6px">${side('H',g.home)}${side('A',g.away)}</div><div class="xs mute" style="margin-top:4px">${en?'Ratings from Sofascore.':'評分來自 Sofascore。'}</div></details>`;
}

function featHtml(e){
  const F=D.feat||{},en=LANG=='en',id=String(e.id);if(e.status==='finished')return '';
  let h='';const R=F.elo||{};
  if(R[e.home]){const ep=(F.elo_p||{})[id];const rank=c=>Object.values(R).filter(v=>v>R[c]).length+1;
    h+=`<div class="small" style="margin-top:4px"><b>Elo</b> <span class="xs mute">${en?'long-term strength':'長期實力評分'}</span>：${nm(e.home)} <b class="num">${R[e.home]}</b> <span class="xs mute">#${rank(e.home)}</span> · ${nm(e.away)} <b class="num">${R[e.away]}</b> <span class="xs mute">#${rank(e.away)}</span>${ep?`<div class="xs mute">${en?'Elo-implied':'Elo 推算'} ${en?'H':'主'}${Math.round(ep[0])}/${en?'D':'平'}${Math.round(ep[1])}/${en?'A':'客'}${Math.round(ep[2])}</div>`:''}</div>`;}
  const rs=(F.rest||{})[id];
  if(rs){h+=`<div class="small" style="margin-top:6px"><b>${en?'Schedule':'賽程密度'}</b></div>`;
    for(const s of ['home','away']){const x=rs[s];if(!x)continue;const warn=x.rest!=null&&x.rest<4;
      h+=`<div class="xs">${nm(e[s])}：${en?'rest':'休息'} <b style="${warn?'color:var(--loss)':''}">${x.rest??'–'}${en?' days':' 天'}</b>${x.last_comp?` (${en?'last':'上一場'} ${comp(x.last_comp)} v ${nm(x.last_vs)})`:''} · ${en?'14-day games':'14天內'} ${x.games14}${en?'':' 場'}${x.next_days!=null?` · ${en?'next':'下一場'} ${x.next_days}${en?'d':'天後'} ${comp(x.next_comp)}${x.next_comp&&x.next_comp!='Premier League'?' ⚠️':''}`:''}</div>`;}}
  const ms=(F.missing||{})[id];
  if(ms&&(ms.home||ms.away)){h+=`<div class="small" style="margin-top:6px"><b>${en?'Absence impact':'缺陣影響'}</b> <span class="xs mute">${en?'(≈ number of regular starters missing)':'（約等於缺了幾個全勤主力）'}</span></div>`;
    for(const s of ['home','away']){const x=ms[s];if(!x||!x.list.length)continue;
      const key=x.list.filter(m=>m.tier=='主力'||m.g+m.a>0);
      h+=`<div class="xs">${nm(e[s])}：<b class="num" style="font-size:14px;${x.impact>=1?'color:var(--loss)':''}">${x.impact}</b> ${x.list.map(m=>`<span style="${m.tier=='主力'?'font-weight:700':''}">${esc(m.name)}</span><span class="mute">(${m.type=='missing'?(en?'out':'缺'):(en?'doubt':'疑')}·${en?TIER[m.tier]||m.tier:m.tier}${m.g||m.a?` · ${m.g}${en?'G':'球'} ${m.a}${en?'A':'助'}`:''})</span>`).join('、')}</div>`;}}
  const O=(F.odds||{})[id];
  if(O){const f=x=>{try{const [a,b]=String(x).split('/');return (+a/(+b||1)+1).toFixed(2)}catch(e){return '–'}};
    const first=O.open||(O.hist[0]||[])[1],cur=(O.hist[O.hist.length-1]||[])[1]||first;
    if(first&&cur){const arrow=(a,b)=>{const x=+f(a),y=+f(b);return y<x-0.02?'<span style="color:var(--win)">▼</span>':y>x+0.02?'<span style="color:var(--loss)">▲</span>':''};
      h+=`<div class="small" style="margin-top:6px"><b>${en?'Odds movement':'賠率走勢'}</b> <span class="xs mute">${en?'opening → now (▼ = market more confident)':'開盤 → 現在（▼ 代表市場更看好）'}</span></div>
      <div class="xs">${['1','X','2'].map((k,i)=>`${[en?'Home':'主勝',en?'Draw':'平',en?'Away':'客勝'][i]} ${f(first[k])} → <b>${f(cur[k])}</b>${arrow(first[k],cur[k])}`).join(' · ')}</div>`;}}
  return h;
}
load().catch(e=>{app.innerHTML='<div class="card empty">載入失敗：'+e+'</div>'});
</script>
